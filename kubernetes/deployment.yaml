apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-campus
  template:
    metadata:
      labels:
        app: smart-campus
    spec:
      containers:
        - name: app
          image: smart-campus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
