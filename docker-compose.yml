services:
  app:
    build: .
    image: smart-campus:latest
    container_name: smart-campus-app
    ports:
      - "5000:5000"
    volumes:
      - campus_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  campus_data:
